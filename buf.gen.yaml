version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/biga-app/server/internal/wirepb
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: internal/wirepb
    opt: paths=source_relative
  - local: ["sh", "-c", "cd ../proto && go run ./cmd/protoc-gen-biga-contract"]
    out: internal/wirepb
    opt: lang=go
inputs:
  - directory: ../proto
